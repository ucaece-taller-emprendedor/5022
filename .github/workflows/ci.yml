name: CI

on:
  push:
  pull_request:

env:
  # Valores de prueba para CI (no son secretos): sirven para validar el entorno y compilar.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rugby5022
  BETTER_AUTH_SECRET: secreto-solo-para-ci-0123456789abcdef0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3000
  ADMIN_EMAILS: admin@demo.5022.test

jobs:
  lint-build:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: Test de humo (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rugby5022
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
