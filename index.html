.panel+.panel{margin-top:18px}.panel .mini{margin-top:16px;line-height:1.6}.stat b{overflow-wrap:anywhere}.fixture-score{font-size:16px!important}.textlink{display:inline-block;color:var(--lime);font-weight:800;font-size:13px;margin-top:10px}.sidebar .side-link{min-width:0}.panel table{min-width:540px}.formbox .mini{color:#ffce94}.navright button{white-space:nowrap}@media(max-width:580px){.navright .btn{padding:10px 11px;font-size:11px}.nav .brand{font-size:24px}.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:15px}.stat b{font-size:22px}.panel{padding:17px}.fixture{align-items:flex-start}.fixture-score{font-size:14px!important}}
.attendance-select{background:#0c1912;color:#fff;border:1px solid #3c5746;border-radius:9px;padding:9px;max-width:180px;width:100%}.panel .field{max-width:440px}.panel .field input,.panel .field select{width:100%;background:#0c1912;border:1px solid #3c5746;border-radius:10px;padding:12px;color:#fff}</style></head><body><div id="app"></div><script>'use strict';
// 5022 — prototipo académico. Todos los resultados, nombres de jugadores y registros son DEMO.
const teams=['Mar del Plata Club','Sporting','San Ignacio','Universitario','Comercial','Los Cardos','Biguá','Pueyrredón'];
const rounds=[
[['Mar del Plata Club','Pueyrredón',31,12],['Sporting','Biguá',26,17],['San Ignacio','Los Cardos',19,22],['Universitario','Comercial',24,18]],
[['Mar del Plata Club','Biguá',28,15],['Pueyrredón','Los Cardos',17,21],['Sporting','Comercial',30,14],['San Ignacio','Universitario',20,20]],
[['Mar del Plata Club','Los Cardos',22,18],['Biguá','Comercial',12,25],['Pueyrredón','Universitario',16,27],['Sporting','San Ignacio',24,19]],
[['Mar del Plata Club','Comercial',null,null],['Los Cardos','Universitario',null,null],['Biguá','San Ignacio',null,null],['Pueyrredón','Sporting',null,null]],
[['Mar del Plata Club','Universitario',null,null],['Comercial','San Ignacio',null,null],['Los Cardos','Sporting',null,null],['Biguá','Pueyrredón',null,null]]
];
const players=[['Mateo Fernández','Pilar',3,0],['Tomás Rodríguez','Hooker',3,1],['Lucas Martínez','Segunda línea',3,0],['Nicolás Pérez','Medio scrum',3,1],['Juan García','Apertura',3,2],['Franco López','Centro',3,1],['Agustín Díaz','Wing',3,2],['Pedro Silva','Fullback',2,1]];
const roles={fan:{title:'Aficionado',items:[['resumen','Resumen'],['partidos','Partidos'],['posiciones','Posiciones'],['estadisticas','Estadísticas']]},club:{title:'Club',items:[['resumen','Resumen'],['plantel','Plantel'],['asistencias','Asistencias'],['lesiones','Lesiones'],['partidos','Mis partidos'],['rendimiento','Rendimiento']]},union:{title:'Unión',items:[['resumen','Resumen'],['competencias','Competencias'],['calendario','Calendario'],['clubes','Clubes']]},admin:{title:'Superadministrador',items:[['resumen','Resumen'],['organizaciones','Organizaciones'],['plataforma','Plataforma']]}};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=(role,section='resumen')=>`#/panel/${role}/${section}`;
const matchRows=rounds.flatMap((matches,i)=>matches.map(([home,away,h,a],j)=>({id:`${i+1}-${j+1}`,round:i+1,home,away,h,a,played:h!==null})));
function positions(){let data=Object.fromEntries(teams.map(name=>[name,{name,pj:0,g:0,e:0,p:0,pf:0,pc:0,pts:0}]));for(const m of matchRows.filter(m=>m.played)){const a=data[m.home],b=data[m.away];a.pj++;b.pj++;a.pf+=m.h;a.pc+=m.a;b.pf+=m.a;b.pc+=m.h;if(m.h>m.a){a.g++;b.p++;a.pts+=4}else if(m.h<m.a){b.g++;a.p++;b.pts+=4}else{a.e++;b.e++;a.pts+=2;b.pts+=2}}return Object.values(data).sort((a,b)=>b.pts-a.pts||b.pf-b.pc-(a.pf-a.pc)||a.name.localeCompare(b.name));}
const allPlayed=()=>matchRows.filter(m=>m.played),nextMatches=()=>matchRows.filter(m=>!m.played&&m.round===4);
function nav(){const user=loadUser();return `<header class="topbar"><div class="container nav"><a class="brand" href="#/"><span class="brandmark">↗</span>5022</a><nav class="navlinks"><a href="#/explorar">Partidos</a><a href="#/posiciones">Posiciones</a><a href="#/funcionalidades">La plataforma</a></nav><div class="navright">${user?`<a class="btn ghost" href="${url(user.role)}">Mi panel</a><button class="btn primary" data-action="logout">Salir</button>`:`<a class="btn ghost" href="#/login">Ingresar</a><a class="btn primary" href="#/registro">Registrarme →</a>`}</div></div></header>`}
function footer(){return `<footer class="footer"><div class="container footrow"><span>© 2026 5022 · Construido para clubes. Hecho para atletas.</span><span>Prototipo académico · Todos los datos son ficticios</span></div></footer>`}
function notice(){return `<div class="notice">DEMO ACADÉMICA: clubes y competencias utilizados como ejemplo; resultados, planteles, cuentas y estadísticas son ficticios. No representa información oficial de la Unión.</div>`}
function fixture(items){return items.map(m=>`<div class="fixture"><div><div class="fixture-names">${esc(m.home)} <span class="muted">vs</span> ${esc(m.away)}</div><div class="fixture-sub">Fecha ${m.round} · ${m.played?'Finalizado':'A programar'}</div></div><div class="fixture-score">${m.played?`${m.h} – ${m.a}`:'Pendiente'}</div></div>`).join('')}
function standings(){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>PF</th><th>PC</th><th>Pts</th></tr></thead><tbody>${positions().map((x,i)=>`<tr><td class="rank">${i+1}</td><td><b>${esc(x.name)}</b></td><td>${x.pj}</td><td>${x.g}</td><td>${x.e}</td><td>${x.p}</td><td>${x.pf}</td><td>${x.pc}</td><td><b>${x.pts}</b></td></tr>`).join('')}</tbody></table></div><p class="mini">Sistema simplificado de demo: 4 puntos por victoria y 2 por empate; no se aplican bonus.</p>`}
function box(title,html){return `<section class="panel"><h3>${title}</h3>${html}</section>`}
function metrics(arr){return `<div class="statgrid">${arr.map(([label,val])=>`<div class="stat"><span>${label}</span><b>${val}</b><span>Datos demo</span></div>`).join('')}</div>`}
function landing(){const top=positions().slice(0,4);return `${nav()}<main><section class="hero"><div class="container hero-grid"><div><span class="eyebrow"><span class="dot"></span> PLATAFORMA DE RUGBY · DEMO</span><h1>El rugby tiene historia.<br><em>Ahora tiene datos.</em></h1><p class="lead">Partidos, posiciones y estadísticas para los aficionados. Gestión deportiva para clubes y uniones. Una sola plataforma, experiencias distintas.</p><div class="actions"><a class="btn primary" href="#/explorar">Ver resultados →</a><a class="btn ghost" href="#/registro">Crear acceso demo</a></div><div class="trust"><div><strong>8</strong><span>clubes en el torneo demo</span></div><div><strong>3</strong><span>fechas con resultados</span></div><div><strong>4</strong><span>perfiles de la plataforma</span></div></div></div><div class="preview"><div class="preview-top"><div><b>Torneo Regional · Primera</b><div class="mini">Temporada ficticia · Fecha 3</div></div><span class="live">● DEMO</span></div>${allPlayed().filter(m=>m.round===3).slice(0,2).map(m=>`<div class="match"><div class="team">${esc(m.home)}</div><div><div class="score">${m.h} : ${m.a}</div><small>FINAL</small></div><div class="team right">${esc(m.away)}</div></div>`).join('')}<div class="standings"><div class="tr head"><span>#</span><span>Equipo</span><span>PJ</span><span>G</span><span>Pts</span></div>${top.map((x,i)=>`<div class="tr"><span>${i+1}</span><b>${esc(x.name)}</b><span>${x.pj}</span><span>${x.g}</span><b>${x.pts}</b></div>`).join('')}</div><p class="mini" style="padding:12px 5px 0">Resultados ilustrativos, no oficiales.</p></div></div></section><section class="section alt" id="funcionalidades"><div class="container"><div class="section-head"><span class="kicker">QUÉ RESUELVE 5022</span><h2>Información deportiva y gestión, sin dispersión.</h2><p>Cada perfil accede únicamente a las herramientas que necesita.</p></div><div class="cards"><article class="card"><div class="symbol">◫</div><h3>Para aficionados</h3><p>Calendario, resultados, posiciones y estadísticas del torneo en un mismo lugar.</p><a class="textlink" href="#/explorar">Explorar partidos →</a></article><article class="card"><div class="symbol">♜</div><h3>Para clubes</h3><p>Plantel, próximos encuentros y rendimiento del equipo en un panel específico.</p><a class="textlink" href="#/registro">Acceder como club →</a></article><article class="card"><div class="symbol">▦</div><h3>Para uniones</h3><p>Visualización de competencias, calendario y clubes participantes.</p><a class="textlink" href="#/registro">Acceder como unión →</a></article></div></div></section><section class="section"><div class="container"><div class="cta"><div><h2>Conocé 5022 desde adentro.</h2><p>Registrate y elegí el perfil que querés explorar.</p></div><a class="btn" href="#/registro">Crear cuenta demo →</a></div></div></section></main>${footer()}`}
function auth(register){return `${nav()}<main class="container"><div class="formbox"><span class="kicker">ACCESO A 5022</span><h1>${register?'Crear cuenta demo':'Ingresar'}</h1><p>${register?'Elegí un perfil. Después del registro entrarás directamente a su panel específico.':'Ingresá con una cuenta demo creada en este navegador, en este navegador (si permite almacenamiento local).'}</p><form id="authform">${register?`<div class="field"><label>Nombre completo</label><input name="name" autocomplete="name" required placeholder="Nombre y apellido"></div>`:''}<div class="field"><label>Correo electrónico</label><input name="email" type="email" autocomplete="email" required placeholder="nombre@ejemplo.com"></div><div class="field"><label>Contraseña de demostración</label><input name="password" type="password" minlength="6" required placeholder="Mínimo 6 caracteres"></div>${register?`<div class="field"><label>Tipo de cuenta</label><select name="role"><option value="fan">Aficionado</option><option value="club">Club</option><option value="union">Unión</option></select></div>`:''}<p class="mini" id="auth-error" role="alert"></p><button class="btn primary wide" type="submit">${register?'Crear cuenta y entrar':'Entrar a mi panel'} →</button></form><p class="mini">Solo demostración local: no uses contraseñas reales. Si abrís el HTML como archivo local, algunos navegadores no conservan las cuentas entre aperturas. Para persistencia confiable, publicá el sitio.</p>${notice()}${!register?'<p style="text-align:center"><a class="textlink" href="#/admin-demo">Ver panel de superadministrador (solo lectura) →</a></p>':''}<p style="text-align:center">${register?'¿Ya tenés cuenta? <a href="#/login" style="color:var(--lime)">Ingresá</a>':'¿No tenés cuenta? <a href="#/registro" style="color:var(--lime)">Registrate</a>'}</p></div></main>${footer()}`}
const memoryStore={};
function safeGet(key){try{const value=localStorage.getItem(key);if(value!==null)return value}catch(e){}return Object.prototype.hasOwnProperty.call(memoryStore,key)?memoryStore[key]:null}
function safeSet(key,value){memoryStore[key]=value;try{localStorage.setItem(key,value);return true}catch(e){return false}}
function safeRemove(key){delete memoryStore[key];try{localStorage.removeItem(key)}catch(e){}}
function saveUser(user){safeSet('5022_user_v5',JSON.stringify(user))}
function saveAccounts(accounts){return safeSet('5022_accounts_v5',JSON.stringify(accounts))}
function setAuthError(message){const el=$('auth-error');if(el)el.textContent=message}
function demoAccounts(){try{const current=safeGet('5022_accounts_v5');const legacy=safeGet('5022_accounts_v4');const value=JSON.parse(current||legacy||'[]');return Array.isArray(value)?value:[]}catch(e){return []}}
function loadUser(){try{return JSON.parse(safeGet('5022_user_v5')||'null')}catch(e){return null}}
function dashboard(role,section){const def=roles[role],user=loadUser();if(!def)return notFound();if(role==='admin'&&location.hash.startsWith('#/panel/admin')&&safeGet('5022_admin_demo')==='1'){}else if(!user||user.role!==role)return `${nav()}<main class="container section"><h2>Acceso al panel ${esc(def.title)}</h2><p class="muted">Este panel requiere iniciar sesión con el perfil correspondiente.</p><div class="actions"><a class="btn primary" href="#/registro">Crear cuenta demo</a><a class="btn ghost" href="#/login">Ingresar</a></div></main>${footer()}`;if(!def.items.some(([key])=>key===section))section='resumen';return `${nav()}<div class="app-shell"><aside class="sidebar"><div class="side-caption">${esc(def.title)} · ${role==='admin'?'Vista demo':esc(user.name)}</div>${def.items.map(([key,label])=>`<a class="side-link ${section===key?'active':''}" href="${url(role,key)}">${esc(label)}</a>`).join('')}<div class="side-caption">CUENTA</div><a class="side-link" href="#/">Volver al inicio</a></aside><main class="workspace"><div class="workhead"><div><span class="kicker">5022 / ${esc(def.title.toUpperCase())}</span><h1>${esc(def.items.find(([key])=>key===section)[1])}</h1><span class="muted">Torneo Regional · Temporada ficticia</span></div><span class="badge-demo">● DEMO</span></div>${content(role,section)}${notice()}</main></div>${footer()}`}
function content(role,section){const played=allPlayed(),club='Mar del Plata Club',clubGames=matchRows.filter(m=>m.home===club||m.away===club),record=positions().find(x=>x.name===club);if(role==='fan'){if(section==='resumen')return `${metrics([['Equipos',teams.length],['Partidos finalizados',played.length],['Fechas completas',3],['Próxima fecha',4]])}<div class="dashboard-grid">${box('Últimos resultados',fixture(played.filter(m=>m.round===3)))}${box('Próxima jornada',fixture(nextMatches()))}</div>`;if(section==='partidos')return `${box('Resultados · Fechas 1 a 3',fixture(played))}${box('Próxima fecha · Fecha 4',fixture(nextMatches()))}`;if(section==='posiciones')return box('Tabla calculada desde los resultados',standings());return `${metrics([['Partidos jugados',played.length],['Puntos totales',played.reduce((s,m)=>s+m.h+m.a,0)],['Promedio por partido',(played.reduce((s,m)=>s+m.h+m.a,0)/played.length).toFixed(1)],['Equipos',teams.length]])}${box('Rendimiento por equipo',`<div class="table-wrap"><table><thead><tr><th>Equipo</th><th>Puntos a favor</th><th>En contra</th><th>Diferencia</th></tr></thead><tbody>${positions().map(x=>`<tr><td>${esc(x.name)}</td><td>${x.pf}</td><td>${x.pc}</td><td>${x.pf-x.pc}</td></tr>`).join('')}</tbody></table></div>`)}`}
if(role==='club'){if(section==='resumen')return `${metrics([['Club',club],['Partidos jugados',record.pj],['Victorias',record.g],['Puntos en tabla',record.pts]])}<div class="dashboard-grid">${box('Mis partidos',fixture(clubGames))}${box('Próximo rival',fixture(clubGames.filter(m=>!m.played).slice(0,1)))}</div>`;if(section==='asistencias')return attendanceView();if(section==='lesiones')return injuriesView();if(section==='plantel')return box('Plantel de ejemplo · 8 jugadores',`<div class="table-wrap"><table><thead><tr><th>Jugador ficticio</th><th>Posición</th><th>PJ</th><th>Tries</th></tr></thead><tbody>${players.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td></tr>`).join('')}</tbody></table></div>`);if(section==='partidos')return box('Calendario del club',fixture(clubGames));return `${metrics([['PJ',record.pj],['G / E / P',`${record.g} / ${record.e} / ${record.p}`],['Puntos a favor',record.pf],['Puntos en contra',record.pc]])}${box('Resumen deportivo',`<p class="muted">Diferencia de puntos: <b>${record.pf-record.pc>0?'+':''}${record.pf-record.pc}</b>. Estos valores se calculan a partir de los mismos partidos visibles para los aficionados.</p>`)}`}
if(role==='union'){if(section==='resumen')return `${metrics([['Clubes',teams.length],['Torneos demo',1],['Partidos disputados',played.length],['Partidos programables',matchRows.filter(m=>!m.played).length]])}<div class="dashboard-grid">${box('Competencia activa','<div class="fixture"><b>Torneo Regional · Primera</b><span class="pill">DEMO</span></div><p class="muted">8 equipos · 5 fechas ilustrativas</p>')}${box('Próxima jornada',fixture(nextMatches()))}</div>`;if(section==='competencias')return `${box('Torneo Regional · Primera',`<p class="muted">Temporada ficticia · ${teams.length} clubes participantes · ${played.length} encuentros finalizados.</p>`)}${box('Clasificación',standings())}`;if(section==='calendario')return [1,2,3,4,5].map(i=>box(`Fecha ${i}`,fixture(matchRows.filter(m=>m.round===i)))).join('');return box('Clubes participantes',`<div class="table-wrap"><table><thead><tr><th>Club</th><th>Competencia</th><th>Estado</th></tr></thead><tbody>${teams.map(x=>`<tr><td>${esc(x)}</td><td>Torneo Regional · Primera</td><td>Demo</td></tr>`).join('')}</tbody></table></div>`)}
if(section==='resumen')return `${metrics([['Perfiles de producto',4],['Uniones demo',1],['Clubes demo',teams.length],['Torneos demo',1]])}${box('Estado del prototipo','<p class="muted">Panel de administración ilustrativo. No hay usuarios reales, permisos de servidor ni operaciones administrativas persistentes.</p>')}`;if(section==='organizaciones')return box('Organizaciones de ejemplo',`<div class="table-wrap"><table><thead><tr><th>Entidad</th><th>Tipo</th><th>Estado</th></tr></thead><tbody><tr><td>Unión de Rugby de Mar del Plata</td><td>Unión</td><td>Demo</td></tr>${teams.map(x=>`<tr><td>${esc(x)}</td><td>Club</td><td>Demo</td></tr>`).join('')}</tbody></table></div>`);return box('Componentes del MVP','<p class="muted">Landing, registro local de demostración, acceso por perfil, paneles diferenciados y estadísticas coherentes derivadas de los resultados. Próxima etapa: backend, autorización real y carga de datos por la unión.</p>')}
function demoStore(key,initial){try{return JSON.parse(localStorage.getItem(key))??initial}catch{return initial}}
const attKey='5022_attendance_demo_v3',injKey='5022_injuries_demo_v3';
function attendanceView(){const saved=demoStore(attKey,{});return `${metrics([['Jugadores',players.length],['Presentes',players.filter((_,i)=>saved[i]==='presente').length],['Ausentes',players.filter((_,i)=>saved[i]==='ausente').length],['Sin registrar',players.filter((_,i)=>!saved[i]).length]])}${box('Asistencia al entrenamiento · Demo',`<p class="muted">Marcá la asistencia de cada jugador. Los cambios quedan guardados solamente en este navegador.</p><div class="field"><label>Fecha de entrenamiento</label><input type="date" id="att-date" value="2026-10-28" aria-label="Fecha del entrenamiento"></div><div class="table-wrap"><table><thead><tr><th>Jugador</th><th>Posición</th><th>Asistencia</th></tr></thead><tbody>${players.map((p,i)=>`<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td><td><select class="attendance-select" data-player="${i}" aria-label="Asistencia de ${esc(p[0])}"><option value="">Sin registrar</option><option value="presente" ${saved[i]==='presente'?'selected':''}>Presente</option><option value="ausente" ${saved[i]==='ausente'?'selected':''}>Ausente</option><option value="justificado" ${saved[i]==='justificado'?'selected':''}>Justificado</option></select></td></tr>`).join('')}</tbody></table></div><p class="mini">Registro de prueba: no se envía a ningún servidor.</p>`)}`}
function injuriesView(){const data=demoStore(injKey,[]);return `${metrics([['Lesiones registradas',data.length],['En recuperación',data.filter(x=>x.status==='En recuperación').length],['Alta deportiva',data.filter(x=>x.status==='Alta deportiva').length],['Jugadores del plantel',players.length]])}${box('Registrar lesión · Demo',`<p class="muted">Registro interno de ejemplo. Evitá ingresar información médica real: esta demo guarda datos únicamente en tu navegador y no tiene controles de privacidad ni acceso.</p><form id="injury-form"><div class="field"><label>Jugador</label><select name="player" required>${players.map(p=>`<option>${esc(p[0])}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input type="date" name="date" required value="2026-10-28"></div><div class="field"><label>Zona afectada (ejemplo)</label><select name="area"><option>Rodilla</option><option>Tobillo</option><option>Hombro</option><option>Muslo</option><option>Otra</option></select></div><div class="field"><label>Estado</label><select name="status"><option>En recuperación</option><option>Alta deportiva</option></select></div><button class="btn primary" type="submit">Guardar registro demo</button></form>`)}${box('Seguimiento de lesiones',data.length?`<div class="table-wrap"><table><thead><tr><th>Jugador</th><th>Fecha</th><th>Zona</th><th>Estado</th><th></th></tr></thead><tbody>${data.map((x,i)=>`<tr><td>${esc(x.player)}</td><td>${esc(x.date)}</td><td>${esc(x.area)}</td><td>${esc(x.status)}</td><td><button class="btn" data-remove-injury="${i}">Quitar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Todavía no hay lesiones registradas en esta demo.</p>')}`}
function publicView(section){return `${nav()}<main class="container section"><div class="section-head"><span class="kicker">EXPLORADOR PÚBLICO</span><h2>${section==='posiciones'?'Tabla de posiciones':'Partidos y resultados'}</h2><p>Competencia ficticia creada para probar 5022.</p></div>${section==='posiciones'?box('Torneo Regional · Primera',standings()):`${box('Últimos resultados',fixture(allPlayed().filter(m=>m.round===3)))}${box('Próxima fecha',fixture(nextMatches()))}`}<div class="actions"><a class="btn primary" href="#/registro">Registrarme para ver mi panel →</a><a class="btn ghost" href="${section==='posiciones'?'#/explorar':'#/posiciones'}">${section==='posiciones'?'Ver partidos':'Ver posiciones'}</a></div>${notice()}</main>${footer()}`}
function notFound(){return `${nav()}<main class="container section"><h2>Página no encontrada</h2><a class="btn primary" href="#/">Volver al inicio</a></main>${footer()}`}
function render(){const path=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);const page=path[0]||'';if(page==='admin-demo'){safeSet('5022_admin_demo','1');location.hash=url('admin');return}if(page==='panel')$('app').innerHTML=dashboard(path[1],path[2]||'resumen');else if(page==='registro'||page==='login')$('app').innerHTML=auth(page==='registro');else if(page==='explorar'||page==='posiciones')$('app').innerHTML=publicView(page);else if(page==='funcionalidades'){$('app').innerHTML=landing();requestAnimationFrame(()=>document.getElementById('funcionalidades')?.scrollIntoView())}else if(!page)$('app').innerHTML=landing();else $('app').innerHTML=notFound();const injuryForm=$('injury-form');if(injuryForm)injuryForm.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(injuryForm);const rows=demoStore(injKey,[]);rows.push({player:String(d.get('player')),date:String(d.get('date')),area:String(d.get('area')),status:String(d.get('status'))});localStorage.setItem(injKey,JSON.stringify(rows));render()});document.querySelectorAll('[data-remove-injury]').forEach(el=>el.addEventListener('click',()=>{const rows=demoStore(injKey,[]);rows.splice(Number(el.dataset.removeInjury),1);localStorage.setItem(injKey,JSON.stringify(rows));render()}));document.querySelectorAll('.attendance-select').forEach(el=>el.addEventListener('change',()=>{const rows=demoStore(attKey,{});if(el.value)rows[el.dataset.player]=el.value;else delete rows[el.dataset.player];localStorage.setItem(attKey,JSON.stringify(rows));render()}));const form=$('authform');if(form)form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form),email=String(d.get('email')).trim().toLowerCase(),password=String(d.get('password'));if(page==='registro'){const user={name:String(d.get('name')).trim(),email,role:String(d.get('role'))};if(!user.name||!['fan','club','union'].includes(user.role))return;const accounts=demoAccounts();if(accounts.some(a=>a.email===email)){$('auth-error').textContent='Este correo ya tiene una cuenta demo. Entrá desde Ingresar.';return}accounts.push({...user,password});const persisted=saveAccounts(accounts);if(!persisted){setAuthError('Aviso: tu navegador no permite guardar cuentas permanentemente desde este archivo. Podés ingresar ahora y durante esta apertura, pero para conservarla entre sesiones hay que publicar la web.')}saveUser(user);location.hash=url(user.role)}else{const account=demoAccounts().find(a=>a.email===email);const previous=loadUser();if(!account||account.password!==password){$('auth-error').textContent='Correo o contraseña incorrectos. Verificá los datos o creá una cuenta nueva. Si abriste otro archivo HTML, los datos pueden estar separados por el navegador.';return}const user={name:account.name,email:account.email,role:account.role};saveUser(user);location.hash=url(user.role)}});document.querySelectorAll('[data-action="logout"]').forEach(el=>el.addEventListener('click',()=>{safeRemove('5022_user_v5');safeRemove('5022_admin_demo');location.hash='/'}));if(page!=='funcionalidades')window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script></body></html>
